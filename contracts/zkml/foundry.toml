# Lab 05's verifier contract and its test (doc 21 §11).
#
# The verifier is generated by `snarkjs zkey export solidityverifier` and is
# never hand-edited -- it is a function of the ceremony's verification key, so
# editing it would make it verify proofs for a different circuit. It is
# committed because the deployed bytecode has to be reproducible from the repo,
# and because the Foundry test below is the only thing that catches a verifier
# and a fixture that have drifted apart.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
# Foundry sandboxes filesystem access, so the proof fixture has to be allowed
# explicitly. Read-only, and scoped to the test directory rather than the repo:
# the test needs one file and nothing else.
fs_permissions = [{ access = "read", path = "./test" }]
